# =============================================================================
# Domain configuration for the Tourism RAG Assistant
# Defines the scope of the knowledge base, source-to-region/state mapping,
# answer policy, and safety/out-of-scope boundaries. Loaded at runtime by
# src/common/config_loader.py and consumed by the prompt builder + retriever.
# =============================================================================

app:
  name: "Tourism RAG Assistant"
  version: "1.0.0"
  description: >
    An authentic, citation-grounded travel intelligence assistant for tourists
    exploring India, covering all Indian states and union territories.

